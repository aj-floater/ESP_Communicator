<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/buttons.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/typography.css">
</head>
<body>
  <div class="wrapper">
    <!-- Top section with connection info and disconnect button -->
    <div class="header">
      <div class="title-container">
        <h2>Interaction Screen</h2>
        <h3>Connected to GROUP_21</h3>
      </div>
      <div class="connection-container">
        <div id="readOutput">Loading...</div>
        <button id="disconnectBtn" class="disconnect-btn">Disconnect</button>
      </div>
    </div>
    
    <!-- Interaction container occupies the remaining vertical space -->
    <div class="interaction-container">
      <div class="write-value-section">
        <!-- Add button to create a new value item -->
         <div class="write-container">
           <div id="writeOutput"></div>
           <button class="write-btn"></button>
         </div>
        <button id="addValueBtn" class="add-value-btn"></button>
        <!-- Container that holds each value item. This container will scroll if there are too many items. -->
        <div id="valuesContainer" class="values-container">
          <!-- Example initial value item -->
          <div class="value-item">
            <div class="value-fields">
              <input type="text" class="value-name" value="Value Name">
              <input type="text" class="value-input" value="0">
            </div>
            <button class="delete-btn"></button>
          </div>
        </div>
      </div>
      <div class="chart-section">
        <div class="chart-wrapper">
          <canvas id="leftChart"></canvas>
        </div>
        <div class="chart-wrapper">
          <canvas id="rightChart"></canvas>
        </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load external scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.3.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@1.27.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-streaming@2.0.0"></script>

  <!-- Load custom scripts -->
  <!-- <script src="renderer/ipcHandlers.js"></script> -->
  <script src="../renderer/connected.js"></script>
  <script src="../main/chart.js"></script>
</body>
</html>
